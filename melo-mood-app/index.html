<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melo Mood</title>
<meta name="description" content="用你自己的聲音，對潛意識說話。AI 顯化腳本、睡前催眠導引與心情日記。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens: dark-first (a bedtime app), light as the day mode ---------- */
:root{
  --ink:#0B0A15; --surface:#16142A; --raised:#211D3F; --hover:#2A2550;
  --text:#F6F0E9; --muted:#A79EBB; --faint:#6F678A;
  --line:rgba(246,240,233,.11); --line-strong:rgba(246,240,233,.22);
  --moon:#F3B08F; --moon-deep:#E07A5F; --moon-ink:#2A1408;
  --jade:#7FD1B9; --jade-ink:#0B2A21;
  --rose:#F49AC1;
  --glow:rgba(243,176,143,.28);
  --shadow:0 30px 80px rgba(0,0,0,.55);
  --r-lg:28px; --r-md:18px; --r-sm:12px; --r-pill:999px;
  --display:"Syne","Noto Serif TC",serif;
  --serif:"Noto Serif TC","Syne",serif;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#F2EDF5; --surface:#FFFFFF; --raised:#EDE6F3; --hover:#E3DAEC;
    --text:#1B1633; --muted:#6B6483; --faint:#9C95B0;
    --line:rgba(27,22,51,.10); --line-strong:rgba(27,22,51,.22);
    --moon:#D4694A; --moon-deep:#B94F33; --moon-ink:#FFF4EE;
    --jade:#22957B; --jade-ink:#EAF8F3;
    --rose:#D9538F;
    --glow:rgba(212,105,74,.22);
    --shadow:0 30px 80px rgba(60,40,90,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ink:#F2EDF5; --surface:#FFFFFF; --raised:#EDE6F3; --hover:#E3DAEC;
  --text:#1B1633; --muted:#6B6483; --faint:#9C95B0;
  --line:rgba(27,22,51,.10); --line-strong:rgba(27,22,51,.22);
  --moon:#D4694A; --moon-deep:#B94F33; --moon-ink:#FFF4EE;
  --jade:#22957B; --jade-ink:#EAF8F3;
  --rose:#D9538F;
  --glow:rgba(212,105,74,.22);
  --shadow:0 30px 80px rgba(60,40,90,.18);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--moon);outline-offset:3px;border-radius:6px}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
::selection{background:var(--moon);color:var(--moon-ink)}

/* ---------- stage ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:40px 24px}
.plate{max-width:300px;display:none}
.plate .wordmark{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1;color:var(--text)}
.plate .wordmark em{font-style:normal;color:var(--moon)}
.plate .tag{font-family:var(--serif);font-size:19px;margin-top:14px;line-height:1.5}
.plate .sub{color:var(--muted);margin-top:14px;font-size:14px;max-width:34ch}
.plate .pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plate .pill i{width:7px;height:7px;border-radius:50%;background:var(--jade);box-shadow:0 0 10px var(--jade)}
.plate .theme{margin-top:26px;display:flex;gap:8px}
.plate .theme button{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--muted)}
.plate .theme button[aria-pressed="true"]{border-color:var(--moon);color:var(--text)}
@media (min-width:820px){.plate{display:block}}

.device{
  position:relative;width:min(100vw,402px);height:min(100vh,860px);
  background:var(--surface);border-radius:0;overflow:hidden;display:flex;flex-direction:column;
}
@media (min-width:480px){
  .device{border-radius:44px;border:1px solid var(--line-strong);box-shadow:var(--shadow);height:min(calc(100vh - 80px),860px)}
}
@media (max-width:479px){.stage{padding:0;min-height:100dvh}.device{height:100dvh}}

/* ---------- screens ---------- */
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:26px 22px 110px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}*{transition:none!important;animation-duration:.001s!important}}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font-family:var(--serif);font-size:28px;line-height:1.2;margin-top:4px}
.title .lat{font-family:var(--display);letter-spacing:-.02em}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.date b{display:block;font-family:var(--display);font-size:26px;color:var(--text);font-weight:800;letter-spacing:-.02em}

.section{margin-top:28px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-h h2{font-family:var(--serif);font-size:17px}
.section-h .more{font-size:12px;color:var(--muted)}

.card{background:var(--raised);border-radius:var(--r-md);padding:18px}
.card.hero{
  background:radial-gradient(120% 90% at 100% 0%,var(--glow),transparent 55%),var(--raised);
  border:1px solid var(--line);
}
.hero .quote{font-family:var(--serif);font-size:21px;line-height:1.5;font-weight:500;margin:6px 0 14px}
.hero .meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip.goal{color:var(--text)}
.chip.jade{background:var(--jade-ink);color:var(--jade);border-color:transparent}
.chip.moon{background:var(--moon-ink);color:var(--moon);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-pill);font-weight:600;font-size:14px;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--moon);color:var(--moon-ink)}
.btn.primary:hover{background:var(--moon-deep);color:#fff}
.btn.ghost{border:1px solid var(--line-strong);color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.soft{background:var(--surface);color:var(--text)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--raised);border-radius:var(--r-md);padding:14px 14px 12px}
.stat .n{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:3px;letter-spacing:.06em}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px}

/* mood row */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:var(--r-md);background:var(--raised);border:1px solid transparent;transition:border-color .15s,transform .12s}
.mood:hover{transform:translateY(-2px)}
.mood[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-ink)}
.mood .face{width:30px;height:30px}
.mood .lbl{font-size:11px;color:var(--muted)}
.mood[aria-pressed="true"] .lbl{color:var(--moon)}

/* quick actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r-md);background:var(--raised);text-align:left;border:1px solid transparent;transition:border-color .15s}
.qa:hover{border-color:var(--line-strong)}
.qa .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.qa .ic svg{width:18px;height:18px}
.qa b{font-size:14px}
.qa span{font-size:12px;color:var(--muted)}

/* selectable rows (goals / tones) */
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--raised);border:1px solid transparent;text-align:left;transition:border-color .15s,background .15s}
.opt[aria-pressed="true"]{border-color:var(--moon);background:var(--moon-ink)}
.opt .em{font-size:20px;width:28px;text-align:center}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.opt .tick{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong)}
.opt[aria-pressed="true"] .tick{background:var(--moon);border-color:var(--moon)}
.opt.tone{padding:14px}

.seg{display:flex;background:var(--raised);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{flex:1;padding:8px 4px;border-radius:var(--r-pill);font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.label{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}

/* script lines */
.script{display:flex;flex-direction:column;gap:10px}
.line{padding:12px 14px;border-radius:var(--r-md);background:var(--raised);font-size:15px;line-height:1.7;transition:background .2s,color .2s;position:relative}
.line.aff{font-family:var(--serif);font-size:16px}
.line.vision{border-left:3px solid var(--jade);background:transparent;color:var(--muted)}
.line.open,.line.close{color:var(--muted)}
.line.punch{font-family:var(--display);font-size:15px;font-weight:700;color:var(--moon);background:transparent;padding:4px 14px}
.line.breath{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);background:transparent;padding:2px 14px}
.line.now{background:var(--moon-ink);color:var(--text);box-shadow:0 0 0 1px var(--moon) inset}
.line.done{opacity:.5}

/* orb player */
.player{position:sticky;bottom:-30px;margin:18px -22px -110px;padding:16px 22px 24px;background:linear-gradient(180deg,transparent,var(--surface) 30%);z-index:3}
.player .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.player .bar i{display:block;height:100%;width:0;background:var(--moon);transition:width .3s linear}
.player .ctl{display:flex;align-items:center;gap:12px}
.player .time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px}
.play{width:54px;height:54px;border-radius:50%;background:var(--moon);color:var(--moon-ink);display:grid;place-items:center;box-shadow:0 8px 30px var(--glow);flex:none}
.play svg{width:22px;height:22px}
.voice-src{font-size:12px;color:var(--muted);text-align:right;flex:1;line-height:1.4}
.voice-src b{display:block;color:var(--text)}

.orb-wrap{display:grid;place-items:center;padding:16px 0 6px}
.orb{width:180px;height:180px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff3e8 0%,var(--moon) 28%,var(--moon-deep) 60%,transparent 72%);
  filter:blur(.2px);box-shadow:0 0 80px var(--glow);
  animation:breathe 14s ease-in-out infinite;}
.orb::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid var(--line-strong);opacity:.6;animation:ring 14s ease-in-out infinite}
.orb.sleep{background:radial-gradient(circle at 35% 30%,#e9fff7 0%,var(--jade) 30%,#2A7A66 62%,transparent 74%);box-shadow:0 0 90px rgba(127,209,185,.28)}
.orb.idle{animation-play-state:paused}
@keyframes breathe{0%{transform:scale(.72)}28%{transform:scale(1)}56%{transform:scale(1)}100%{transform:scale(.72)}}
@keyframes ring{0%{transform:scale(.9);opacity:.2}28%{transform:scale(1.08);opacity:.7}56%{transform:scale(1.08);opacity:.7}100%{transform:scale(.9);opacity:.2}}
.orb .phase{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--moon-ink);text-transform:uppercase}
.orb.sleep .phase{color:var(--jade-ink)}

/* journal */
.entry{background:var(--raised);border-radius:var(--r-md);padding:14px 16px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.entry .face{width:34px;height:34px}
.entry .d{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.entry .g{margin-top:4px;font-size:14px}
.entry .g span{display:inline-block;margin-right:6px}
.entry .g span::before{content:"✦ ";color:var(--moon);font-size:11px}
.entry .t{margin-top:6px;font-size:13px;color:var(--muted)}
.entry .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.entry .tags i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted)}
.entry.demo{position:relative}
.entry.demo::after{content:"範例";position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);border:1px dashed var(--line-strong);padding:1px 6px;border-radius:4px}

.moodchart{display:block;width:100%;height:auto}
.legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:4px;letter-spacing:.06em}

/* forms */
.field{margin-bottom:14px}
.input,textarea.input{width:100%;padding:12px 14px;border-radius:var(--r-md);background:var(--raised);border:1px solid transparent;color:var(--text)}
.input:focus{border-color:var(--moon);outline:none}
textarea.input{min-height:90px;resize:vertical}
.input::placeholder{color:var(--faint)}
.grat{display:grid;gap:8px}
.grat .input{padding-left:36px;background-image:none}
.grat .g{position:relative}
.grat .g::before{content:"✦";position:absolute;left:14px;top:12px;color:var(--moon);font-size:13px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow button{padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.tagrow button[aria-pressed="true"]{border-color:var(--moon);color:var(--moon);background:var(--moon-ink)}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--surface) 26%);z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;color:var(--faint);font-size:11px;min-width:58px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--moon)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--glow))}

/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(6,5,14,.55);backdrop-filter:blur(6px);z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 22px 34px;z-index:9;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 18px}
.sheet h2{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.device.sheet-open .sheet-bg{opacity:1;pointer-events:auto}
.device.sheet-open .sheet.open{transform:none}

/* onboarding */
#onboard{padding-top:34px}
.ob-step{display:none}
.ob-step.active{display:block;animation:fade .3s ease}
.ob-progress{display:flex;gap:6px;margin-bottom:26px}
.ob-progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ob-progress i.on{background:var(--moon)}
.ob-h{font-family:var(--serif);font-size:30px;line-height:1.25;margin-bottom:8px}
.ob-h .lat{font-family:var(--display);color:var(--moon);letter-spacing:-.02em}
.ob-p{color:var(--muted);margin-bottom:22px;max-width:36ch}
.ob-foot{position:absolute;left:22px;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;gap:10px}

/* recorder */
.rec{background:var(--raised);border-radius:var(--r-lg);padding:18px}
.rec .read{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--text);padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border-left:3px solid var(--moon)}
.rec canvas{width:100%;height:64px;display:block;margin:14px 0 6px}
.rec .rc{display:flex;align-items:center;gap:14px}
.recbtn{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.recbtn i{width:24px;height:24px;border-radius:50%;background:#E5484D;transition:border-radius .2s,transform .2s}
.recbtn.on i{border-radius:5px;transform:scale(.7);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.rec .rt{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.rec .rs{font-size:12px;color:var(--muted)}
.voicecard{display:flex;align-items:center;gap:12px}
.voicecard .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--jade) var(--p,0%),var(--line) 0);position:relative}
.voicecard .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--raised)}
.voicecard .ring svg{position:relative;z-index:1;width:18px;height:18px}
.voicecard b{display:block;font-size:14px}
.voicecard span{font-size:12px;color:var(--muted)}

/* pricing */
.plans{display:grid;gap:10px}
.plan{border-radius:var(--r-md);padding:16px;background:var(--raised);border:1px solid transparent;position:relative}
.plan.best{border-color:var(--moon);background:radial-gradient(120% 90% at 100% 0%,var(--glow),transparent 55%),var(--raised)}
.plan .pn{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.plan .pp{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:2px}
.plan .pp b{font-family:var(--display);font-size:22px;color:var(--text);font-weight:800}
.plan ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:13px}
.plan li::before{content:"— ";color:var(--moon)}
.plan .badge{position:absolute;top:14px;right:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;text-align:right}
.list{display:grid;gap:8px}
.list .opt{cursor:pointer}

.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:20;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px dashed var(--line-strong);font-size:12px;color:var(--muted);margin-bottom:18px}

<script>
/* =====================================================================
   Melo Mood · demo build
   All data lives in localStorage. Optional keys unlock real voice cloning

   ===================================================================== */
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return todayKey(d); };

/* ---------- content ---------- */
const GOALS = {
  wealth:{name:'財富自由',emoji:'💰',hint:'收入、版稅、被動現金流',
    aff:['金錢自然地、持續地流向我。','我值得富足，也允許自己接收。','我的收入來自我的創造力與價值。','每一筆支出都帶著感謝，每一筆收入都帶著喜悅。','我和金錢的關係輕鬆、健康、充滿信任。','機會不斷出現，而我準備好了。','我用金錢創造自由，也創造愛。','富足是我的自然狀態。'],
    vision:'想像你打開手機，看見帳戶裡的數字安靜地成長。你不需要緊抓，只是微笑，因為你知道，這只是開始。',
    sleep:['在你睡著的時候，你的潛意識正在為你打開富足的門。','明天醒來，你會注意到更多機會，那都是為你準備的。']},
  music:{name:'音樂與舞台',emoji:'🎤',hint:'作品、演出、被對的人聽見',
    aff:['我的聲音有力量，能觸動人心。','舞台是我的家，我在上面自由呼吸。','我的音樂正被對的人聽見。','每一次創作，我都更靠近真正的自己。','版稅、合作與邀約，正在向我走來。','我允許自己被看見、被聽見、被記住。','我的作品有自己的生命，走得比我更遠。','我是藝術家，也是自己的老闆。'],
    vision:'想像燈光暗下，第一個音落下，全場安靜地等你。你的聲音填滿整個空間，而你，只是在做自己。',
    sleep:['你的聲音在夢裡繼續練習，變得更自由、更有力量。','睡著時，宇宙正在安排對的人聽見你。']},
  love:{name:'愛與關係',emoji:'💗',hint:'伴侶、家人、靈魂連結',
    aff:['我值得被溫柔、穩定、深刻地愛著。','我先把愛給自己，然後愛自然流動。','對的人正在向我靠近，我不必追趕。','我的關係滋養我、也讓我成長。','我可以柔軟，也可以有界線。','我釋放過去，為新的連結騰出空間。','愛在我身邊，愛就是我。','我的心是打開的，也是安全的。'],
    vision:'想像有一個人，在你什麼都沒做的時候，就已經選擇了你。你們並肩坐著，安靜而完整。',
    sleep:['你安全，你被愛，你可以完全放鬆。','在夢裡，你的心更打開了一點點。']},
  health:{name:'身體與能量',emoji:'🌿',hint:'睡眠、運動、無糖飲食',
    aff:['我的身體是我最信任的夥伴。','每一次呼吸，我都更放鬆、更有能量。','我選擇讓身體感覺好的食物與動作。','我的睡眠深沉，醒來時充滿電。','我的身體知道如何自我修復。','運動是我送給自己的禮物。','我的能量清澈、穩定、明亮。','我照顧身體，身體也照顧我。'],
    vision:'想像早晨醒來，身體輕盈，呼吸很深。你伸展、你走動，每個細胞都在說：我準備好了。',
    sleep:['你的身體正在修復、更新，每一個細胞都在休息。','明天早上，你會比今天更有能量。']},
  confidence:{name:'自信與魅力',emoji:'✨',hint:'被看見、說話有份量',
    aff:['我不需要任何人的許可才能發光。','我的存在本身就是價值。','我說話時，世界會停下來聽。','我走進房間，房間就換了頻率。','我不怕被看見，我就是為此而生。','我信任自己的決定。','我的獨特是我最大的資產。','自信不是我努力得到的，是我本來就有的。'],
    vision:'想像你推開門走進去，不用說話，整個房間的能量就轉向你。你放鬆、你微笑，因為你知道自己是誰。',
    sleep:['你已經足夠了，現在只是讓身體記住這件事。','醒來的時候，你會帶著一種安靜的確定感。']},
  creative:{name:'創作靈感',emoji:'🎨',hint:'點子、專案、一人公司',
    aff:['靈感隨時找得到我，因為我隨時都在。','我的創作不需要完美，只需要真實。','我允許自己玩，好點子就會來。','我的想法值得被做出來。','我用作品跟世界說話。','我信任直覺，它從不遲到。','每一天，我都在建造屬於我的宇宙。','創作讓我活著。'],
    vision:'想像你坐在工作桌前，靈感像水一樣流出來。你不追它，它自己來，因為這裡是它的家。',
    sleep:['你的潛意識整晚都在為你收集靈感。','明天，一個新的想法會自然地找到你。']},
};
const TONES = {
  gentle:{name:'溫柔',emoji:'🌙',hint:'像深夜的朋友，慢慢說',rate:.88,
    open:['嗨，{name}。慢慢來，這段時間是你的。','先深深吸一口氣……再慢慢吐出來。'],
    punch:['你可以慢慢來，一切都在對的時間。','你已經做得很好了。','沒有什麼需要證明。'],
    close:['謝謝你今天出現在這裡。','把這份感覺帶進今天，輕輕的，就夠了。']},
  firm:{name:'堅定',emoji:'🔥',hint:'像教練，短、直接、有力',rate:.96,
    open:['{name}，聽好了。今天的你，正在成為那個版本的自己。','吸氣。吐氣。現在，我們開始。'],
    punch:['這是事實，不是希望。','我決定了，就是這樣。','沒有 B 計畫。'],
    close:['現在，睜開眼睛，去做。','你不是在等待，你是在行動。']},
  baddie:{name:'Baddie 模式',emoji:'💅',hint:'高街潮流 × 5D 意識，帶點壞',rate:1,
    open:['Okay {name}，鏡子裡那個人已經是頂級了，我們只是提醒她一下。','吸口氣，把肩膀放下來，皇冠戴正。'],
    punch:['而且，我值得。','說真的，這根本不是問題。','Period.'],
    close:['好了，去把今天拿下來。','記得：你不是在追什麼，你是在被追。']},
};
const MOODS = [
  {v:1,l:'很低',c:'#8C86A8'},{v:2,l:'有點累',c:'#A88FBF'},{v:3,l:'平靜',c:'#7FD1B9'},{v:4,l:'不錯',c:'#F3B08F'},{v:5,l:'發光',c:'#F49AC1'},
];
const TAGS = ['工作','創作','家人','關係','身體','金錢','靈性','休息'];
const READ_TEXT = '我是夏日的風，也是深夜的海。我允許自己慢下來，也允許自己被看見。今天，我把注意力放在我想要的地方，讓每一個字，都成為我的頻率。';

/* ---------- state ---------- */
const KEY = 'melomood.v1';
const state = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function seed(){
  const g = [['創作','關係'],['工作','身體'],['靈性'],['創作','金錢'],['休息'],['關係','家人'],['工作'],['創作'],['身體','靈性'],['金錢','工作'],['關係'],['創作','靈性']];
  const moods = [4,3,5,4,2,4,3,5,4,3,4,5];
  const grats = [
    ['錄音室的光很好','Adam 傳來的訊息','無糖拿鐵'],['划船機 20 分鐘','把提案寄出去了','晚上早睡'],['冥想時的安靜','一個新的旋律'],['Muvix 第一筆訂金','靈感筆記寫滿一頁','媽媽的湯'],['什麼都沒做的下午'],['一通很長的電話','被理解的感覺'],['把待辦砍到三件','專注 90 分鐘'],['副歌寫出來了','演出邀約'],['身體很輕','8 小時的睡眠'],['版稅入帳','新的合作提案','清楚的界線'],['被好好對待','一句剛好的話'],['凌晨三點的靈感','月亮','自己'],
  ];
  const notes = ['今天的能量對了。','有點累，但方向是對的。','很安靜，很滿。','事情開始動了。','允許自己休息。','愛是安靜的。','清理路障的一天。','聲音很自由。','身體在說謝謝。','富足是流動的。','界線讓我更柔軟。','靈感來得像海浪。'];
  const entries = moods.map((m,i)=>({id:'demo'+i,date:daysAgo(11-i),mood:m,gratitude:grats[i],note:notes[i],tags:g[i],demo:true}));
  return {
    demo:true,
    profile:{name:'Melody',goals:['music','wealth','confidence'],tone:'baddie',voice:{recorded:true,seconds:42,at:daysAgo(3),voiceId:''},createdAt:daysAgo(11)},
    entries,
    sessions:[{date:daysAgo(1),type:'sleep',min:12},{date:daysAgo(2),type:'manifest',min:7},{date:daysAgo(3),type:'manifest',min:3},{date:daysAgo(4),type:'sleep',min:12},{date:daysAgo(5),type:'manifest',min:7},{date:daysAgo(7),type:'manifest',min:7}],
    settings:{elevenKey:'',claudeKey:'',theme:''},
    ui:{goal:'music',minutes:7},
  };
}

/* ---------- seeded shuffle ---------- */
function rng(seed){ let h=1779033703^seed.length; for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;} return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;}; }
function shuffle(arr, r){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const pick = (arr,r)=>arr[Math.floor(r()*arr.length)];

/* ---------- script engine ---------- */
function journalContext(){
  const e = [...state.entries].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!e) return null;
  const recent = state.entries.filter(x=>x.date>=daysAgo(6));
  const avg = recent.length ? recent.reduce((s,x)=>s+x.mood,0)/recent.length : 3;
  return {last:e, avg, grat:e.gratitude?.[0]};
}
function buildScript({goal, minutes, tone, name, seed}){
  const G = GOALS[goal], T = TONES[tone], r = rng(seed);
  const ctx = journalContext();
  const count = minutes<=3?8:minutes<=7?16:28;
  const lines = [];
  const L = (t,kind,pause=900)=>lines.push({t,kind,pause});
  L(T.open[0].replace('{name}',name||'你'),'open',1200);
  L('吸氣 4 · 停 4 · 吐氣 6','breath',6000);
  L(T.open[1],'open',1400);
  if(ctx?.grat) L(`昨天你寫下感謝：「${ctx.grat}」。這份感謝，今天也在。`,'open',1500);
  if(ctx && ctx.avg<2.6) L('我知道最近有點累。沒關係，我們今天只做一件事：相信。','open',1500);
  const affs = shuffle(G.aff, r);
  let punchIdx = 0;
  for(let i=0;i<count;i++){
    if(i===8) L('再說一次，慢一點，讓身體聽見。','breath',2500);
    if(i===16) L('最後一輪，這次是用心說的。','breath',2500);
    L(affs[i%affs.length],'aff',i>=8?1600:1200);
    if((i+1)%4===0) L(T.punch[punchIdx++%T.punch.length],'punch',1100);
  }
  L(G.vision,'vision',2600);
  L('停在這個畫面裡，三次呼吸。','breath',9000);
  L(T.close[0],'close',900);
  L(T.close[1],'close',600);
  return lines;
}
function buildSleep({goals, name}){
  const lines = []; const L=(t,kind,pause=1800)=>lines.push({t,kind,pause});
  L(`${name||'你'}，今天結束了。你什麼都不用做了。`,'open',2200);
  L('讓身體沉進床裡，讓床接住你。','open',2200);
  L('吸氣……慢慢吐氣……讓吐氣比吸氣長一點。','open',5000);
  L('現在，注意你的額頭，讓它放鬆。眼睛周圍，放鬆。下巴，鬆開。','aff',3200);
  L('肩膀落下來。手臂變重。手掌打開。','aff',3200);
  L('胸口很輕，肚子很軟，每一次呼吸都更深一點。','aff',3200);
  L('大腿、小腿、腳掌……全部都放下了。','aff',3200);
  L('我會從 10 數到 1。每一個數字，你都更深、更放鬆。','open',1800);
  for(let n=10;n>=1;n--) L(n===1?'1……完全放鬆。':`${n}……更深一點。`,'breath',n>5?2200:3000);
  goals.slice(0,3).forEach(g=>GOALS[g].sleep.forEach(s=>L(s,'aff',3400)));
  L('你不需要努力，一切都已經在路上。','punch',2600);
  L('你安全。你被愛。你已經足夠。','aff',3400);
  L('現在，你可以睡了。晚安。','close',4000);
  return lines;
}

/* ---------- optional: Claude deep personalisation ---------- */
async function generateWithClaude({goal, minutes, tone, name}){
  const key = state.settings.claudeKey; if(!key) return null;
  const G = GOALS[goal], T = TONES[tone];
  const recent = [...state.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5)

  const system = `你是 Melo Mood 的顯化腳本作者。用繁體中文（台灣）、第一人稱現在式寫一段給使用者自己唸給自己聽的顯化腳本。語氣：${T.name}（${T.hint}）。長度約 ${minutes} 分鐘的朗讀量。每行一句，不要編號、不要標題、不要 markdown。結構：開場呼吸 → 肯定語（可重複、漸進）→ 一段具體的視覺化畫面 → 收尾。從使用者最近的日記裡挑一兩個具體細節放進腳本，讓它像只為她寫的。`;

/* ---------- playback (browser voices or your cloned voice) ---------- */
const player = {timer:null,idx:0,lines:[],onTick:null,playing:false,audio:null,startedAt:0,elapsed:0,total:0};
function estimateMs(lines, rate){ return lines.reduce((s,l)=>s+Math.max(600,l.t.length*230/rate)+l.pause,0); }
function zhVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/zh[-_]TW/i.test(v.lang)&&/Mei|Hsiao|female|Google/i.test(v.name)) || vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
function stopPlayback(){
  player.playing=false; clearTimeout(player.timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  if(player.audio){ player.audio.pause(); player.audio=null; }
  player.onTick && player.onTick({idx:-1,pct:0,done:false,stopped:true});
}
async function playLines(lines, {rate=.9, onTick, onDone, mode='manifest'}={}){
  stopPlayback();
  player.lines=lines; player.idx=0; player.playing=true; player.onTick=onTick; player.total=estimateMs(lines,rate); player.startedAt=Date.now();
  const clone = state.profile.voice?.voiceId && state.settings.elevenKey;
  if(clone){
    try{ await playCloned(lines, rate, onTick, onDone); return; }
    catch(e){ toast('聲音複製服務暫時無法連線，改用系統聲音'); }
  }
  if(!('speechSynthesis' in window)){ toast('這個瀏覽器不支援語音播放'); simulate(lines,onTick,onDone); return; }
  const voice = zhVoice();
  const step = ()=>{
    if(!player.playing) return;
    if(player.idx>=lines.length){ player.playing=false; onTick&&onTick({idx:-1,pct:1,done:true}); onDone&&onDone(); return; }
    const l = lines[player.idx];
    onTick&&onTick({idx:player.idx,pct:Math.min(1,(Date.now()-player.startedAt)/player.total),done:false});
    const u = new SpeechSynthesisUtterance(l.t.replace(/·/g,'，').replace(/…/g,'，'));
    u.lang='zh-TW'; if(voice) u.voice=voice; u.rate=rate; u.pitch=1;
    u.onend = ()=>{ player.idx++; player.timer=setTimeout(step, l.pause); };
    u.onerror = ()=>{ player.idx++; player.timer=setTimeout(step, 400); };
    speechSynthesis.speak(u);
  };
  step();
}
function simulate(lines,onTick,onDone){
  const step=()=>{ if(!player.playing) return; if(player.idx>=lines.length){player.playing=false;onTick&&onTick({idx:-1,pct:1,done:true});onDone&&onDone();return;}
    onTick&&onTick({idx:player.idx,pct:player.idx/lines.length,done:false}); const l=lines[player.idx++]; player.timer=setTimeout(step, l.t.length*220+l.pause); };
  step();
}
async function playCloned(lines, rate, onTick, onDone){
  const text = lines.map(l=>l.t + (l.pause>2500?' <break time="2s"/>' : ' ')).join('\n');
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${state.profile.voice.voiceId}?output_format=mp3_44100_128`,{
    method:'POST',headers:{'xi-api-key':state.settings.elevenKey,'content-type':'application/json'},
    body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:.55,similarity_boost:.8,style:.2,speed:rate}})});
  if(!res.ok) throw new Error('ElevenLabs '+res.status);
  const blob = await res.blob(); const a = new Audio(URL.createObjectURL(blob)); player.audio=a;
  a.ontimeupdate=()=>{ if(!a.duration) return; const pct=a.currentTime/a.duration; const idx=Math.min(lines.length-1,Math.floor(pct*lines.length)); onTick&&onTick({idx,pct,done:false}); };
  a.onended=()=>{ player.playing=false; onTick&&onTick({idx:-1,pct:1,done:true}); onDone&&onDone(); };
  await a.play();
}

/* ---------- voice recorder ---------- */
function mountRecorder(host, {onDone}){
  host.innerHTML = `<div class="rec">
    <div class="read">${esc(READ_TEXT)}</div>
    <canvas class="wave" width="640" height="128" aria-hidden="true"></canvas>
    <div class="rc">
      <button class="recbtn" aria-label="開始錄音"><i></i></button>
      <div><div class="rt">00:00</div><div class="rs">按下開始，唸上面的句子</div></div>
      <button class="btn sm ghost use" style="margin-left:auto" disabled>使用這段</button>
    </div>

  </div>`;
  const btn=$('.recbtn',host), rt=$('.rt',host), rs=$('.rs',host), use=$('.use',host), cv=$('.wave',host), ctx=cv.getContext('2d');
  let rec=null, chunks=[], t0=0, tick=null, an=null, raf=null, stream=null, blob=null, secs=0;
  const draw=()=>{ const css=getComputedStyle(document.documentElement); const moon=css.getPropertyValue('--moon').trim(), line=css.getPropertyValue('--line-strong').trim();
    ctx.clearRect(0,0,cv.width,cv.height); const data=new Uint8Array(an?an.fftSize:64); an&&an.getByteTimeDomainData(data);
    ctx.strokeStyle=an?moon:line; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<data.length;i++){ const x=i/data.length*cv.width, y=an?(data[i]/128)*cv.height/2:cv.height/2; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); raf=requestAnimationFrame(draw); };
  draw();
  const stop=()=>{ rec&&rec.state!=='inactive'&&rec.stop(); clearInterval(tick); stream&&stream.getTracks().forEach(t=>t.stop()); an=null; btn.classList.remove('on'); btn.setAttribute('aria-label','開始錄音'); };
  btn.onclick=async()=>{

      rec=new MediaRecorder(stream); chunks=[]; rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{ blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}); use.disabled=secs<5; rs.textContent=secs<5?'太短了，至少 5 秒':'錄好了 · 可以試聽或使用'; if(secs>=5){ const a=$('.rt',host); a.style.cursor='pointer'; a.title='試聽'; a.onclick=()=>new Audio(URL.createObjectURL(blob)).play(); } };
      rec.start(); t0=Date.now(); btn.classList.add('on'); btn.setAttribute('aria-label','停止錄音'); rs.textContent='錄音中… 再按一次停止';
      tick=setInterval(()=>{ secs=Math.round((Date.now()-t0)/1000); rt.textContent=`${pad(Math.floor(secs/60))}:${pad(secs%60)}`; if(secs>=90) stop(); },250);
    }catch(e){ rs.textContent='麥克風沒有權限。可以先跳過，之後在「我」裡再錄。'; }
  };
  use.onclick=async()=>{
    stop();
    state.profile.voice={recorded:true,seconds:secs,at:todayKey(),voiceId:state.profile.voice?.voiceId||''};
    if(state.settings.elevenKey && blob){
      use.disabled=true; rs.textContent='上傳樣本、建立你的聲音…';
      try{
        const fd=new FormData(); fd.append('name',`MeloMood · ${state.profile.name||'me'}`); fd.append('files',blob,'sample.webm'); fd.append('remove_background_noise','true');
        const r=await fetch('https://api.elevenlabs.io/v1/voices/add',{method:'POST',headers:{'xi-api-key':state.settings.elevenKey},body:fd});
        if(!r.ok) throw new Error(r.status); const j=await r.json(); state.profile.voice.voiceId=j.voice_id; toast('聲音複製完成 ✦');
      }catch(e){ toast('上傳失敗，先用系統聲音'); }
    }
    save(); cancelAnimationFrame(raf); onDone&&onDone();
  };
  return ()=>{ stop(); cancelAnimationFrame(raf); };
}

let noise=null;
function toggleNoise(){
  if(noise){ noise.gain.gain.exponentialRampToValueAtTime(.0001,noise.ctx.currentTime+1); setTimeout(()=>{noise.ctx.close();},1200); noise=null; return false; }
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const w=Math.random()*2-1; d[i]=(last+.02*w)/1.02; last=d[i]; d[i]*=3.5; }
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const drone=ctx.createOscillator(); drone.type='sine'; drone.frequency.value=108; const dg=ctx.createGain(); dg.gain.value=.05;
  const lfo=ctx.createOscillator(); lfo.frequency.value=.07; const lg=ctx.createGain(); lg.gain.value=.03; lfo.connect(lg); lg.connect(dg.gain);
  const gain=ctx.createGain(); gain.gain.value=.0001; gain.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+3);
  src.connect(lp); lp.connect(gain); drone.connect(dg); dg.connect(gain); gain.connect(ctx.destination); src.start(); drone.start(); lfo.start();
  noise={ctx,gain}; return true;
}

  const light=()=>getComputedStyle(document.documentElement).colorScheme==='light';
  const draw=t=>{ ctx.clearRect(0,0,w,h); const L=light(); ctx.fillStyle=L?'rgba(27,22,51,.35)':'rgba(246,240,233,.9)';
    for(const s of stars){ const a=reduce?.6:.35+.35*Math.sin(t/1400*s.s+s.p); ctx.globalAlpha=a*(L?.6:1); ctx.beginPath(); ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,7); ctx.fill(); if(!reduce){ s.y+=s.s*.08; if(s.y>h) s.y=0; } }
    ctx.globalAlpha=1; if(!reduce) requestAnimationFrame(draw); };
  requestAnimationFrame(draw);
})();

/* ---------- boot ---------- */
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
if(!state.profile.name){ startOnboarding(); } else { go('home'); }
</script>
